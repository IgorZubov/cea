# Publishes the sandbox image for `cea build --pull`. The tag is the same content hash of
# cea/sandbox/Dockerfile that a local `cea build` uses, so `cea doctor` finds it after a pull.
name: sandbox image

on:
  push:
    branches: [main]
    paths: ["cea/sandbox/Dockerfile", ".github/workflows/sandbox-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: image tag
        id: tag
        run: |
          echo "hash=$(python3 -c 'from cea.sandbox import image_hash; print(image_hash())')" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: cea/sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.tag.outputs.owner }}/cea-sandbox:${{ steps.tag.outputs.hash }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
